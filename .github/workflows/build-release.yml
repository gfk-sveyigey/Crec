name: Build & Release

# PR 合并到 main 后：一次性编译 iOS + Android，打包后发布 Release（版本号取自仓库根目录的 VERSION 文件）。
# 标签 v<VERSION> 已存在时跳过，不重复发布。
on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

permissions:
  contents: write

jobs:
  # 先读出 VERSION 并判断标签是否已存在，两个平台构建据此决定跑不跑
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      raw: ${{ steps.version.outputs.raw }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          set -e
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found in repository root"
            exit 1
          fi

          RAW=$(tr -d '[:space:]' < VERSION)
          if [ -z "$RAW" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi

          if ! echo "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION '$RAW' is not a valid semver"
            exit 1
          fi

          # iOS 的 CFBundleShortVersionString 只接受 x.y.z，发版请用纯数字版本号
          if ! echo "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION '$RAW' cannot be used as a mobile app version (must be x.y.z)"
            exit 1
          fi

          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          echo "Version: $RAW"

      - name: Check existing tag
        id: check
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist; will release."
          fi

      - name: Save PR body
        if: steps.check.outputs.exists == 'false'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          mkdir -p dist
          if [ -z "$PR_BODY" ]; then
            printf '_No description provided._\n' > dist/PR_BODY.md
          else
            printf '%s\n' "$PR_BODY" > dist/PR_BODY.md
          fi

      - name: Upload PR body
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: pr-body
          path: dist/PR_BODY.md
          if-no-files-found: error
          retention-days: 3

  build-ios:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          set -e
          flutter --version
          xcodebuild -version
          pod --version || echo "::warning::CocoaPods not found on PATH"

      - name: Flutter pub get
        run: flutter pub get

      - name: Validate ios/Runner/Info.plist
        run: |
          set -e
          PLIST=ios/Runner/Info.plist
          test -f "$PLIST" || { echo "::error::$PLIST not found"; exit 1; }
          plutil -lint "$PLIST"
          plutil -extract CFBundleDisplayName raw "$PLIST"
          plutil -extract CFBundleIdentifier raw "$PLIST" | grep -qx '\$(PRODUCT_BUNDLE_IDENTIFIER)' \
            || echo "::warning::CFBundleIdentifier is not the standard PRODUCT_BUNDLE_IDENTIFIER placeholder"

      # ios/Runner.xcodeproj 不提交（由 flutter create 生成）。
      # 先脚手架到临时目录，再用 rsync --ignore-existing 只补齐缺失文件，
      # 已提交的 Info.plist / AppDelegate.swift / storyboard / AppIcon 不会被覆盖。
      - name: Generate Xcode project (if missing)
        run: |
          set -e
          if [ -d ios/Runner.xcodeproj ]; then
            echo "ios/Runner.xcodeproj already present; skipping scaffold."
            exit 0
          fi
          flutter create --platforms=ios --org com.aholic --project-name crec /tmp/crec_scaffold
          rsync -a --ignore-existing /tmp/crec_scaffold/ios/ ios/
          test -d ios/Runner.xcodeproj
          grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' ios/Runner.xcodeproj/project.pbxproj

      - name: Build unsigned iOS app
        run: |
          set -e
          rm -rf build/ios
          flutter build ios --release --no-codesign --build-name="${{ needs.prepare.outputs.raw }}" --build-number="${{ github.run_number }}"

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find build/ios -maxdepth 2 -type d -name 'Runner.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::Runner.app was not produced"
            exit 1
          fi
          echo "App bundle: $APP"

          IPA="build/Crec-${{ needs.prepare.outputs.raw }}-unsigned.ipa"
          rm -rf build/Payload "$IPA"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Runner.app

          cd build
          /usr/bin/zip -qry "$(basename "$IPA")" Payload
          cd ..
          rm -rf build/Payload

          test -f "$IPA"
          ls -lh "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/Crec-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 3

  build-android:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          set -e
          flutter --version
          java -version

      - name: Flutter pub get
        run: flutter pub get

      - name: Validate Android applicationId
        run: |
          set -e
          test -f android/app/build.gradle || { echo "::error::android/app/build.gradle not found"; exit 1; }
          grep -q 'applicationId = "com.aholic.crec"' android/app/build.gradle \
            || { echo "::error::applicationId must be com.aholic.crec"; exit 1; }
          grep -q 'namespace = "com.aholic.crec"' android/app/build.gradle \
            || { echo "::error::namespace must be com.aholic.crec"; exit 1; }

      # gradlew / gradle-wrapper.jar 不提交（由 flutter create 生成），
      # 同样用 rsync --ignore-existing 只补缺失文件，已提交的 manifest / build.gradle / 图标不会被覆盖。
      - name: Generate Gradle wrapper (if missing)
        run: |
          set -e
          if [ -f android/gradlew ] && [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper already present; skipping scaffold."
            exit 0
          fi
          flutter create --platforms=android --org com.aholic --project-name crec /tmp/crec_scaffold
          rsync -a --ignore-existing /tmp/crec_scaffold/android/ android/
          chmod +x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          grep -m1 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK (Release)
        run: |
          set -e
          rm -rf build/app
          flutter build apk --release --build-name="${{ needs.prepare.outputs.raw }}" --build-number="${{ github.run_number }}"

      - name: Package APK
        run: |
          set -e
          APK=$(find build/app/outputs -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced"
            exit 1
          fi

          OUT="build/Crec-${{ needs.prepare.outputs.raw }}.apk"
          cp "$APK" "$OUT"
          ls -lh "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/Crec-*.apk
          if-no-files-found: error
          retention-days: 3

  # 两个平台都成功后，一次性把 IPA + APK 挂到同一个 Release
  release:
    needs: [ prepare, build-ios, build-android ]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect artifacts
        id: collect
        run: |
          set -e
          ls -la dist
          IPA=$(find dist -name '*.ipa' | head -n 1)
          APK=$(find dist -name '*.apk' | head -n 1)
          test -n "$IPA" || { echo "::error::IPA was not downloaded"; exit 1; }
          test -n "$APK" || { echo "::error::APK was not downloaded"; exit 1; }
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA" "$APK"

      - name: Calculate SHA256
        run: |
          set -e
          IPA="${{ steps.collect.outputs.ipa }}"
          APK="${{ steps.collect.outputs.apk }}"
          printf '%s  %s\n' "$(sha256sum "$IPA" | awk '{print $1}')" "$(basename "$IPA")" > dist/SHA256.txt
          printf '%s  %s\n' "$(sha256sum "$APK" | awk '{print $1}')" "$(basename "$APK")" >> dist/SHA256.txt
          cat dist/SHA256.txt

      - name: Build release notes
        run: |
          set -e
          BODY=dist/PR_BODY.md
          if [ ! -f "$BODY" ]; then
            printf '_No description provided._\n' > "$BODY"
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "### 构建产物"
            echo ""
            echo "- iOS 无签名 IPA: $(basename "${{ steps.collect.outputs.ipa }}")"
            echo "- Android APK: $(basename "${{ steps.collect.outputs.apk }}")"
            echo ""
            echo "### SHA256"
            echo ""
            echo '```text'
            cat dist/SHA256.txt
            echo '```'
          } >> "$BODY"

          cat "$BODY"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Crec ${{ needs.prepare.outputs.tag }}"
          body_path: dist/PR_BODY.md
          files: |
            dist/Crec-*.ipa
            dist/Crec-*.apk
            dist/SHA256.txt
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.raw, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
