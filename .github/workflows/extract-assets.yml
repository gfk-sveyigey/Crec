name: Extract Assets.car (manual)

# 只手动触发（Actions 页面 → Run workflow），不随 push / PR 运行。
# 在 macOS runner 上用 Xcode 自带的 assetutil 解析 iOS 的 Assets.car：
#   - 必定产出 out/assets.json 与 out/asset-names.txt（命名颜色 RGBA、资源名、尺寸）
#   - 尽力而为地导出 PNG（acextract / cartool），失败只告警、不影响任务成功
on:
  workflow_dispatch:
    inputs:
      car_path:
        description: "Assets.car 在仓库中的路径（留空 = 自动搜索）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Assets.car
        id: locate
        run: |
          set -e
          CAR="${{ inputs.car_path }}"
          if [ -z "$CAR" ]; then
            CAR=$(find . -name 'Assets.car' -not -path './.git/*' | head -n 1)
          fi
          if [ -z "$CAR" ] || [ ! -f "$CAR" ]; then
            echo "::error::Assets.car not found (input='${{ inputs.car_path }}')"
            exit 1
          fi
          echo "car=$CAR" >> "$GITHUB_OUTPUT"
          echo "Found: $CAR"
          ls -lh "$CAR"
          shasum -a 256 "$CAR"

      - name: Toolchain info
        run: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --find assetutil || true

      # ---- 这一份是必定成功的产出：命名颜色的 RGBA + 资源名/尺寸 ----
      - name: Dump asset info (assetutil)
        run: |
          set -e
          mkdir -p out
          CAR="${{ steps.locate.outputs.car }}"
          if xcrun --find assetutil >/dev/null 2>&1; then
            xcrun assetutil --info "$CAR" > out/assets.json
          elif xcrun --sdk iphoneos --find assetutil >/dev/null 2>&1; then
            xcrun --sdk iphoneos assetutil --info "$CAR" > out/assets.json
          else
            /Applications/Xcode.app/Contents/Developer/usr/bin/assetutil --info "$CAR" > out/assets.json
          fi
          wc -c out/assets.json
          head -c 400 out/assets.json || true

      - name: Summarize names and colors
        run: |
          set -e
          python3 tool/summarize_assets.py out/assets.json out/asset-names.txt

      # ---- 尽力而为：导出 PNG。失败只告警，不影响上面的产出 ----
      - name: Extract images (best effort)
        continue-on-error: true
        run: |
          set -e
          CAR="${{ steps.locate.outputs.car }}"
          mkdir -p out/car
          echo "::group::try acextract (brew)"
          brew install acextract >/dev/null 2>&1 || true
          if command -v acextract >/dev/null 2>&1; then
            acextract -i "$CAR" -o out/car/ || true
          else
            echo "acextract not available"
          fi
          echo "::endgroup::"
          if [ -z "$(ls -A out/car 2>/dev/null)" ]; then
            echo "::group::try cartool (git clone + make)"
            git clone --depth 1 https://github.com/steventroughtonsmith/cartool.git /tmp/cartool || true
            if [ -d /tmp/cartool ]; then
              (cd /tmp/cartool && make) || true
              /tmp/cartool/cartool "$CAR" out/car/ || true
            fi
            echo "::endgroup::"
          fi
          echo "--- produced ---"
          find out/car -type f | head -n 40 || true

      - name: Report
        if: always()
        run: |
          set -e
          ls -laR out | head -n 60 || true
          IMG=$(find out/car -type f 2>/dev/null | wc -l)
          echo "images extracted: $IMG"
          if [ "$IMG" -eq 0 ]; then
            echo "::warning::没有导出任何 PNG（acextract / cartool 都失败）—— assets.json 仍然可用，里面有命名颜色的 RGBA。"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assets-car-extract
          path: out/
          if-no-files-found: warn
          retention-days: 14
