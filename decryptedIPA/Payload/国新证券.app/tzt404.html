    <section>

        <span class="desc">网络出现异常，请检查网络</span>
        <div class="refresh">点击重试</div>
    </section>
    <script>
      (function () {
        function isModels(models) {
          var artVersion = navigator.platform;
          var appversion = artVersion.toLocaleLowerCase();
          return appversion.indexOf(models) >= 0 ? 1 : 0;
        }

        function init() {
          document.querySelector('.refresh').addEventListener('click',function() {
            console.log(1111);
            location.reload();
          })
          var artBody = document.body.getBoundingClientRect();
          var artHeight = artBody.height;
          var obj = { contentheight: artHeight + 20 };
          var jsonObj = JSON.stringify(obj);
          var message = {
            func: "reqwebcontentparam",
            data: jsonObj,
          };
          if (isModels("iphone")) {
            window.webkit.messageHandlers.setContentParams.postMessage(message);
          } else {
            if (
              isModels("tztZFHarmony", true) &&
              window &&
              window.setContentParams &&
              window.setContentParams.call
            ) {
              var __webObj = JSON.stringify(message);
              window && window.setContentParams.call(__webObj);
            } else {
              window.MyWebView.setContentParams("reqwebcontentparam", jsonObj);
            }
          }
        }

        window.onload = function () {
          init();
        };

        window.GoBackOnLoad = function () {
          init();
        };
      })();
    </script>
