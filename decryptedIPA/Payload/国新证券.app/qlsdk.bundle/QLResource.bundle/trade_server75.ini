/***************************************
**登录配置请读取[login]
**股票的菜单请读取[m_股票]
**同理，基金和融资融券分别读取[m_基金][m_融资融券]
**理财的菜单请读取[m_理财]
**如果基金、理财的配置不存在，则不用显示基金、理财标签

**每项菜单格式：
**;格式:m1=显示名称,功能号,子菜单section
**m1=持仓,100
**m2=下单,1,s_股票下单

**其中m1的100指的是没有子菜单，直接是对应功能号100(资金股份)
**m2的1指的是有子菜单，子菜单的配置读取[s_股票下单]

**每项子菜单格式：
**;支持平铺(tile)和列表(list)，默认tile
**显示方式=tile
**;格式:m1=显示名称,功能号
**m1=当日委托,200

**每个功能号的定义请读取[f_功能号]：

***************************************/
/***************************************
**;功能号定义规则
**1-9999:表示特殊需程序处理的功能号
**10000-19999:表示查询功能号，客户端可统一处理
**1:表示有子菜单
**30000-39999表示子菜单，配置时，只要保证在某个菜单的一级菜单配置的ID不重复即可，除已定义的菜单功能外
**普通功能号[100-999]
**基金功能号[1000-1999]
**融资融券功能号[2000-2999]
**港股功能号[3000-3999]
**理财功能号[4000-4999]

**普通查询功能号[10000-10999]，其中[10900-10999]可由服务端随意配置，否则需由协议文档定义
**基金查询功能号[11000-11999]，其中[11900-11999]可由服务端随意配置
**融资融券查询功能号[12000-12999]，其中[12900-12999]可由服务端随意配置
**港股查询功能号[13000-13999]，其中[13900-13999]可由服务端随意配置
**理财查询功能号[14000-14999]，其中[14900-14999]可由服务端随意配置

**子菜单显示方式：显示方式=tile|list,默认tile
**                tile:平铺方式
**                list:列表方式
**查询列表类别：querytype=normal|history,默认normal
**              normal:没有任何输入框
**              history:有两个日期输入框(增加起始结束字段定义：起始日期,结束日期)

**买卖类别字段：买卖类别=20,(当读取的值非0时，表示本配置有效，否则无效)
**在查询界面，需要根据买卖类别显示不同的颜色，请在需要买卖类别名称字段时，增加请求买卖类别字段。

**第一个值表示一级菜单序号，第二个值表示二级菜单序号，都从0开始
**跳转=1,1
***************************************/
