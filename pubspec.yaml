name: crec
description: "国新证券 CREC Securities cross-platform client (Flutter) driven by public market-data endpoints."
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icons/action/
    - assets/icons/hq/
    - assets/icons/tab/
    - assets/icons/watch/
    - assets/images/
  # 行情数字字体：提取自原 App（tztNum，仅含 0-9 与 + - . , % / ¥ : 等符号）
  fonts:
    - family: tztNum
      fonts:
        - asset: assets/fonts/tztNum.ttf
          weight: 400
        - asset: assets/fonts/tztNum-Medium.ttf
          weight: 500
